[build]
  command = "npm run build"
  publish = "dist"

# SPA deep-link fallback for BrowserRouter (/invite/:slug, /create/*, etc.).
# Also mirrored in public/_redirects so it ships with the build output.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  # Set the real value in Netlify UI as well; this documents the production default.
  VITE_PUBLIC_SITE_URL = "https://invana.stream"
